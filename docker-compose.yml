version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: meeting-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: meeting_room
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - meeting-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meeting-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meeting-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meeting-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: "123456"
      DB_DATABASE: meeting_room
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: meeting-room-jwt-secret-2024
      JWT_EXPIRES_IN: 7d
      SERVER_PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meeting-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: meeting-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - meeting-network

volumes:
  mysql_data:
  redis_data:

networks:
  meeting-network:
    driver: bridge
